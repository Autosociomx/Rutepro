    <!--
    Demostración de RutePro en un solo archivo.
    Funciona sin internet y sin base de datos: todo se guarda en este
    navegador. Nada de lo que se capture aquí sale de la computadora.
  -->
</head>
  <body style="background:#06080C">
    <div id="root">
      <!-- Este aviso lo borra la aplicación al arrancar. Si se queda en
           pantalla, el navegador no pudo ejecutar el archivo. -->
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;font-family:system-ui,-apple-system,sans-serif;color:#EEF1F8;background:#06080C">
        <div style="max-width:380px;text-align:center">
          <div style="font-size:40px;margin-bottom:14px">🍞</div>
          <div style="font-size:17px;font-weight:700;margin-bottom:10px">Superpan La Cantera</div>
          <div id="rp-cargando" style="font-size:13px;color:#8A93A8;line-height:1.5">Abriendo la demostración…</div>
          <div id="rp-ayuda" style="display:none;font-size:12.5px;color:#8A93A8;line-height:1.6;margin-top:14px">
            El navegador no pudo abrir la demostración.<br /><br />
            Prueba con <strong style="color:#E8B04A">Google Chrome</strong>: arrástrale este archivo a una pestaña nueva.
            Si lo abriste desde el correo o WhatsApp en el teléfono, guárdalo primero y ábrelo desde Chrome.
          </div>
        </div>
      </div>
    </div>
    <script>
      // Si en 6 segundos la aplicación no reemplazó este aviso, algo la bloqueó:
      // mejor decirlo que dejar la pantalla en negro.
      setTimeout(function () {
        var cargando = document.getElementById('rp-cargando');
        var ayuda = document.getElementById('rp-ayuda');
        if (cargando && ayuda) { cargando.style.display = 'none'; ayuda.style.display = 'block'; }
      }, 6000);
    </script>
