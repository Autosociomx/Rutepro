name: ConnectX Core CI

on:
  pull_request:
  push:
    branches:
      - feat/connectx-negocio-os-core-v01

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        id: install
        shell: bash
        run: |
          set +e
          npm ci > install.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate
        id: validate
        if: steps.install.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          npm run ci > validate.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectx-ci-diagnostics
          path: |
            install.log
            validate.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Enforce result
        if: always()
        shell: bash
        run: |
          install_code="${{ steps.install.outputs.exit_code }}"
          validate_code="${{ steps.validate.outputs.exit_code }}"
          if [ "$install_code" != "0" ]; then
            echo "npm ci failed"
            exit 1
          fi
          if [ "$validate_code" != "0" ]; then
            echo "npm run ci failed"
            exit 1
          fi
