name: ConnectX Core CI

on:
  pull_request:
  push:
    branches:
      - feat/connectx-negocio-os-core-v01

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Execute deterministic core tests
        run: npm run core:check
      - name: Build ConnectX hybrid server and web client
        run: npm run build:connectx
