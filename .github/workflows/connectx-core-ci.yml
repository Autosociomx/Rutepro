name: ConnectX Core CI

on:
  pull_request:
  push:
    branches:
      - feat/connectx-negocio-os-core-v01

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
