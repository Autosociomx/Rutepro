[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API routes → Netlify Functions (must come before the SPA catch-all)
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/generate-config-from-url"
  to = "/.netlify/functions/generate-config-from-url"
  status = 200
  force = true

[[redirects]]
  from = "/api/send-report"
  to = "/.netlify/functions/send-report"
  status = 200
  force = true

[[redirects]]
  from = "/api/create-payment"
  to = "/.netlify/functions/create-payment"
  status = 200
  force = true

[[redirects]]
  from = "/api/conekta-webhook"
  to = "/.netlify/functions/conekta-webhook"
  status = 200
  force = true

# SPA catch-all — serves index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
